name: SnagPlayer
options:
  bundleIdPrefix: com.costa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: Snag
    TARGETED_DEVICE_FAMILY: "1"          # iPhone
    DEVELOPMENT_TEAM: 5HT736L2AJ
    CODE_SIGN_STYLE: Automatic
targets:
  SnagPlayer:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../Shared
      - path: Resources
    dependencies:
      - target: SnagWidgetExtension
        embed: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Snag
        CFBundleDisplayName: Snag
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: "Snag finds your Mac on the local network to sync your music."
        NSAppleMusicUsageDescription: "Snag reads the music already on your iPhone so you can play it all in one place."
        NSBonjourServices: ["_snag._tcp"]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.costa.SnagPlayer
            CFBundleURLSchemes: [snag]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait

  SnagWidgetExtension:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_NAME: SnagWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.costa.SnagPlayer.widget
    sources:
      - path: Widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Snag
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  SnagPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: SnagPlayer
    settings:
      base:
        PRODUCT_NAME: SnagPlayerTests
        PRODUCT_BUNDLE_IDENTIFIER: com.costa.SnagPlayerTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Snag.app/Snag"
        BUNDLE_LOADER: "$(TEST_HOST)"

  SnagPlayerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: SnagPlayer
    settings:
      base:
        PRODUCT_NAME: SnagPlayerUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.costa.SnagPlayerUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SnagPlayer

schemes:
  SnagPlayer:
    build:
      targets:
        SnagPlayer: all
        SnagPlayerTests: [test]
    test:
      targets:
        - SnagPlayerTests
        - SnagPlayerUITests
