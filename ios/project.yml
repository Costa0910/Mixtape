name: SnagPlayer
options:
  bundleIdPrefix: com.costa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: Snag
    TARGETED_DEVICE_FAMILY: "1"          # iPhone
    DEVELOPMENT_TEAM: 3ZHAXWQ5PA
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
targets:
  SnagPlayer:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - target: SnagWidgetExtension
        embed: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Snag
        CFBundleDisplayName: Snag
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: "Snag finds your Mac on the local network to sync your music."
        NSAppleMusicUsageDescription: "Snag reads the music already on your iPhone so you can play it all in one place."
        NSBonjourServices: ["_snag._tcp"]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.costa.SnagPlayer
            CFBundleURLSchemes: [snag]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait

  SnagWidgetExtension:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_NAME: SnagWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.costa.SnagPlayer.widget
    sources:
      - path: Widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Snag
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  SnagPlayer:
    build:
      targets:
        SnagPlayer: all
