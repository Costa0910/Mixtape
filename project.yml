name: Snag
options:
  bundleIdPrefix: com.costa
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: Snag
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  Snag:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        optional: true
      - path: Tools/bin
        type: folder
        optional: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Snag
        CFBundleDisplayName: Snag
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: "Snag lets your iPhone find this Mac on your Wi‑Fi to sync music."
        NSBonjourServices: ["_snag._tcp"]
    entitlements:
      path: Sources/Snag.entitlements
      properties:
        com.apple.security.app-sandbox: false
